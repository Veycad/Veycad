<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="1080" viewBox="0 0 1444 1080">
  <defs>
    <linearGradient id="sigma" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9E3427"/><stop offset=".35" stop-color="#242D2F"/><stop offset="1" stop-color="#050606"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6B2033"/><stop offset="1" stop-color="#16090D"/></linearGradient>
    <linearGradient id="fear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFEFEA"/><stop offset=".45" stop-color="#EFEFEA"/><stop offset=".46" stop-color="#E44F39"/><stop offset=".68" stop-color="#E44F39"/><stop offset=".69" stop-color="#171717"/></linearGradient>
    <linearGradient id="duality" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#15334D"/><stop offset=".49" stop-color="#15334D"/><stop offset=".5" stop-color="#652B21"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000" flood-opacity=".32"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .ui{font-family:Inter,Arial,sans-serif}.label{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#FF4A32}.h1{font-size:35px;font-weight:700;letter-spacing:-1.4px;fill:#F7FAFC}.h2{font-size:27px;font-weight:700;letter-spacing:-.8px;fill:#F7FAFC}.body{font-size:14px;fill:#B9C3CB}.strong{font-size:14px;font-weight:700;fill:#F7FAFC}.small{font-size:11px;fill:#78838B}.tiny{font-size:9px;font-weight:700;letter-spacing:.8px;fill:#FF4A32}.screen-label{font-size:14px;font-weight:700;fill:#464E51}.brand{font-size:12px;font-weight:800;letter-spacing:2.6px;fill:#F7FAFC}.icon{fill:none;stroke:#F7FAFC;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.muted-icon{fill:none;stroke:#78838B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1444" height="1080" fill="#E7E8E5"/>
  <g class="ui">
    <text x="64" y="54" font-size="24" font-weight="700" fill="#15191A">Veykad App Design</text>
    <text x="64" y="79" font-size="12" fill="#687073">Core screens · Android · Dark theme</text>

    <!-- CREATE -->
    <text class="screen-label" x="64" y="112">01 · CREATE</text>
    <g id="screen-create" transform="translate(64 130)" filter="url(#shadow)">
      <rect width="412" height="900" rx="32" fill="#050708" stroke="#273035"/>
      <g id="create-header">
        <text class="brand" x="22" y="39">VEYKAD</text><circle cx="94" cy="35" r="3.5" fill="#FF4A32"/>
        <rect x="350" y="15" width="40" height="40" rx="14" fill="#20272B"/>
        <path class="icon" d="M362 28h16M365 35h10M360 42h20M369 25v6M372 32v6M365 39v6"/>
      </g>
      <text class="label" x="22" y="92">НОВЫЙ МОНТАЖ</text>
      <text class="h1" x="22" y="139">Твои видео.</text><text class="h1" x="22" y="177">Готовый монтаж.</text>
      <text class="body" x="22" y="207">Добавь исходники и выбери стиль — Veykad</text><text class="body" x="22" y="228">сам найдёт лучшие моменты, музыку и ритм.</text>
      <g id="add-video">
        <rect x="22" y="255" width="368" height="88" rx="24" fill="#101416" stroke="#384044" stroke-dasharray="5 5"/>
        <rect x="38" y="275" width="48" height="48" rx="17" fill="#2B1715"/><path class="icon" stroke="#FF4A32" d="M62 288v22M51 299h22"/>
        <text class="strong" x="100" y="293">Добавить видео</text><text class="small" x="100" y="313">до 2 роликов · от 6 секунд</text>
        <path class="muted-icon" d="M370 294l6 6-6 6"/>
      </g>
      <text class="strong" x="24" y="385">Стиль</text><text class="tiny" x="326" y="385">ВСЕ СТИЛИ</text>
      <g id="style-card">
        <rect x="22" y="398" width="368" height="98" rx="24" fill="#101416" stroke="#273035"/>
        <rect x="32" y="408" width="78" height="78" rx="17" fill="url(#sigma)"/><text x="57" y="460" font-size="34" font-weight="700" fill="#FFF">Σ</text>
        <text class="strong" x="124" y="438">Сигма</text><text class="small" x="124" y="459">Тёмный фон · живое появление</text><text class="small" x="124" y="476">· акценты</text><path class="muted-icon" d="M369 440l6 6-6 6"/>
      </g>
      <g id="music-auto">
        <rect x="22" y="508" width="368" height="59" rx="18" fill="#111618"/>
        <path class="icon" stroke="#FF4A32" d="M40 531v14M45 526v19M50 534v11M55 529v16"/>
        <text class="strong" x="68" y="532" font-size="12">Музыка подберётся автоматически</text><text class="small" x="68" y="550">Под стиль и темп видео</text><text class="tiny" x="348" y="541">AUTO</text>
      </g>
      <g id="create-disabled">
        <rect x="22" y="590" width="368" height="58" rx="19" fill="#20272B"/>
        <text x="143" y="625" font-size="14" font-weight="700" fill="#78838B">Создать монтаж</text>
        <text class="small" x="145" y="671">Сначала добавь видео</text>
      </g>
      <g id="create-nav">
        <rect x="0" y="818" width="412" height="82" fill="#050708"/><line x1="0" y1="818" x2="412" y2="818" stroke="#20272B"/>
        <path class="icon" stroke="#FF4A32" d="M136 842l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/><text class="tiny" x="117" y="879">СОЗДАТЬ</text>
        <path class="muted-icon" d="M273 842h18v15h-18zM277 838h10"/><text class="small" x="271" y="879">Эдиты</text>
      </g>
    </g>

    <!-- EDITS -->
    <text class="screen-label" x="516" y="112">02 · EDITS</text>
    <g id="screen-edits" transform="translate(516 130)" filter="url(#shadow)">
      <rect width="412" height="900" rx="32" fill="#050708" stroke="#273035"/>
      <g id="edits-header"><text class="brand" x="22" y="39">VEYKAD</text><circle cx="94" cy="35" r="3.5" fill="#FF4A32"/><rect x="350" y="15" width="40" height="40" rx="14" fill="#20272B"/><path class="icon" d="M362 28h16M365 35h10M360 42h20M369 25v6M372 32v6M365 39v6"/></g>
      <text class="label" x="22" y="92">ТВОЯ КОЛЛЕКЦИЯ</text><text class="h1" x="22" y="139">Мои эдиты</text><rect x="356" y="108" width="34" height="34" rx="12" fill="#151A1C"/><text class="small" x="370" y="130">4</text>
      <g id="latest-edit">
        <rect x="22" y="165" width="368" height="146" rx="24" fill="#101416" stroke="#7A382F"/>
        <rect x="32" y="175" width="96" height="126" rx="17" fill="url(#sigma)"/><text x="63" y="248" font-size="40" font-weight="700" fill="#FFF">Σ</text>
        <circle cx="80" cy="238" r="20" fill="#050708" fill-opacity=".65"/><path d="M76 230l12 8-12 8z" fill="#FFF"/><rect x="91" y="278" width="29" height="15" rx="5" fill="#050708" fill-opacity=".7"/><text x="96" y="289" font-size="8" fill="#FFF">0:15</text>
        <text class="tiny" x="144" y="193">● НЕ СОХРАНЁН</text><text class="strong" x="144" y="222">Последний монтаж</text><text class="small" x="144" y="243">Сигма · сегодня, 18:42</text><text class="tiny" x="144" y="278">↓ СОХРАНИТЬ В ГАЛЕРЕЮ</text><path class="muted-icon" d="M369 231l6 6-6 6"/>
      </g>
      <text class="strong" x="24" y="354">Сохранённые</text><text class="small" x="300" y="354">Сначала новые⌄</text>
      <g id="edit-heartbeat"><rect x="22" y="372" width="178" height="220" rx="24" fill="url(#heart)"/><circle cx="111" cy="468" r="21" fill="#050708" fill-opacity=".6"/><path d="M107 460l12 8-12 8z" fill="#FFF"/><text x="167" y="575" font-size="9" fill="#FFF">0:12</text><text class="strong" x="24" y="617">Heartbeat</text><text class="small" x="24" y="637">Вчера · 19 МБ</text></g>
      <g id="edit-fear"><rect x="212" y="372" width="178" height="220" rx="24" fill="url(#fear)"/><circle cx="301" cy="468" r="21" fill="#050708" fill-opacity=".6"/><path d="M297 460l12 8-12 8z" fill="#FFF"/><text x="357" y="575" font-size="9" fill="#FFF">0:10</text><text class="strong" x="214" y="617">FEAR</text><text class="small" x="214" y="637">21 сен · 17 МБ</text></g>
      <g id="edit-duality"><rect x="22" y="660" width="178" height="124" rx="24" fill="url(#duality)"/><text x="91" y="735" font-size="30" font-weight="700" fill="#FFF">Ⅱ</text><text class="strong" x="24" y="810">DUALITY</text><text class="small" x="24" y="830">18 сен · 23 МБ</text></g>
      <g id="edits-nav"><rect x="0" y="818" width="412" height="82" fill="#050708"/><line x1="0" y1="818" x2="412" y2="818" stroke="#20272B"/><path class="muted-icon" d="M136 842l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/><text class="small" x="119" y="879">Создать</text><path class="icon" stroke="#FF4A32" d="M273 842h18v15h-18zM277 838h10"/><text class="tiny" x="269" y="879">ЭДИТЫ</text></g>
    </g>

    <!-- SETTINGS -->
    <text class="screen-label" x="968" y="112">03 · SETTINGS</text>
    <g id="screen-settings" transform="translate(968 130)" filter="url(#shadow)">
      <rect width="412" height="900" rx="32" fill="#050708" stroke="#273035"/>
      <g id="settings-header"><rect x="22" y="15" width="40" height="40" rx="14" fill="#20272B"/><path class="icon" d="M48 27l-8 8 8 8M40 35h13"/><text class="brand" x="170" y="39">VEYKAD</text><circle cx="242" cy="35" r="3.5" fill="#FF4A32"/></g>
      <text class="label" x="22" y="92">ПРИЛОЖЕНИЕ</text><text class="h1" x="22" y="139">Настройки</text>
      <text class="small" x="24" y="183" font-weight="700" letter-spacing="1">МОНТАЖ</text>
      <g id="settings-montage">
        <rect x="22" y="196" width="368" height="292" rx="24" fill="#101416" stroke="#273035"/>
        <g transform="translate(0 0)"><rect x="36" y="214" width="38" height="38" rx="13" fill="#2B1715"/><text x="48" y="239" font-size="18" fill="#FF4A32">✦</text><text class="strong" x="88" y="224">Стиль по умолчанию</text><text class="small" x="88" y="244">Используется для нового монтажа</text><text class="small" x="324" y="234">Сигма ›</text></g>
        <line x1="36" y1="269" x2="376" y2="269" stroke="#20272B"/>
        <g><rect x="36" y="286" width="38" height="38" rx="13" fill="#2B1715"/><text x="48" y="311" font-size="17" fill="#FF4A32">▣</text><text class="strong" x="88" y="296">Качество видео</text><text class="small" x="88" y="316">Размер и время рендера</text><text class="small" x="320" y="306">1080p ›</text></g>
        <line x1="36" y1="342" x2="376" y2="342" stroke="#20272B"/>
        <g><rect x="36" y="358" width="38" height="38" rx="13" fill="#2B1715"/><text x="48" y="383" font-size="17" fill="#FF4A32">⇩</text><text class="strong" x="88" y="369">Сохранять автоматически</text><text class="small" x="88" y="389">Добавлять эдиты в галерею</text><rect x="326" y="363" width="48" height="28" rx="14" fill="#273035"/><circle cx="340" cy="377" r="11" fill="#FFF"/></g>
        <line x1="36" y1="415" x2="376" y2="415" stroke="#20272B"/>
        <g><rect x="36" y="431" width="38" height="38" rx="13" fill="#2B1715"/><text x="49" y="456" font-size="16" fill="#FF4A32">●</text><text class="strong" x="88" y="442">Уведомлять о готовности</text><text class="small" x="88" y="462">Когда монтаж можно открыть</text><rect x="326" y="436" width="48" height="28" rx="14" fill="#FF4A32"/><circle cx="360" cy="450" r="11" fill="#FFF"/></g>
      </g>
      <text class="small" x="24" y="528" font-weight="700" letter-spacing="1">ПАМЯТЬ</text>
      <g id="settings-storage"><rect x="22" y="541" width="368" height="134" rx="24" fill="#101416" stroke="#273035"/><text class="strong" x="38" y="569">Временные файлы</text><text class="small" x="38" y="589">Исходники и данные рендера</text><text class="tiny" x="326" y="572">248 МБ</text><rect x="38" y="606" width="336" height="5" rx="3" fill="#273035"/><rect x="38" y="606" width="62" height="5" rx="3" fill="#FF4A32"/><line x1="38" y1="628" x2="374" y2="628" stroke="#20272B"/><text class="small" x="119" y="653" font-weight="700">⌫  Очистить временные файлы</text></g>
      <text class="small" x="24" y="715" font-weight="700" letter-spacing="1">О ПРИЛОЖЕНИИ</text>
      <g id="settings-about"><rect x="22" y="728" width="368" height="126" rx="24" fill="#101416" stroke="#273035"/><text class="strong" x="42" y="760">Конфиденциальность</text><text class="small" x="42" y="780">Видео обрабатываются на устройстве</text><text class="small" x="365" y="768">›</text><line x1="38" y1="795" x2="374" y2="795" stroke="#20272B"/><text class="strong" x="42" y="828">Версия Veykad</text><text class="small" x="337" y="828">1.0.0</text></g>
    </g>
  </g>
</svg>
