name: Android baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-test.txt
      - name: Install Python test dependencies
        run: python -m pip install -r tools/requirements-test.txt
      - name: Verify baseline
        run: ./gradlew --no-daemon clean baselineVerify -PpythonExecutable=python
      - name: Assemble isolated preview APK
        run: ./gradlew --no-daemon :app:assembleManualMvp
      - name: Locate isolated ARM64 preview APK
        id: preview-apk
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('app/build/outputs/apk/manualMvp')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.veycad.app.preview'
          outputs = [entry for entry in metadata['elements'] if entry['filters'] == [{'filterType': 'ABI', 'value': 'arm64-v8a'}]]
          assert len(outputs) == 1
          apk = directory / outputs[0]['outputFile']
          assert apk.is_file() and apk.suffix == '.apk' and apk.resolve().parent == directory.resolve()
          info = {'sourceSha': os.environ['GIT_SHA'], 'builtCommit': os.environ['GITHUB_SHA'],
                  'applicationId': metadata['applicationId'], 'variant': 'manualMvp',
                  'apk': apk.name, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          (directory / 'preview-build.json').write_text(json.dumps(info, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'apk={apk.as_posix()}\n')
          PY
      - name: Save isolated ARM64 preview APK and identity
        uses: actions/upload-artifact@v4
        with:
          name: veykad-preview-arm64-${{ env.GIT_SHA }}
          path: |
            ${{ steps.preview-apk.outputs.apk }}
            app/build/outputs/apk/manualMvp/output-metadata.json
            app/build/outputs/apk/manualMvp/preview-build.json
          if-no-files-found: error
      - name: Locate verified ARM64 debug APK
        id: debug-apk
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('app/build/outputs/apk/debug')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.veycad.app'
          outputs = [entry for entry in metadata['elements'] if entry['filters'] == [{'filterType': 'ABI', 'value': 'arm64-v8a'}]]
          assert len(outputs) == 1, 'Expected exactly one ARM64 debug APK'
          apk = directory / outputs[0]['outputFile']
          assert apk.is_file() and apk.suffix == '.apk' and apk.resolve().parent == directory.resolve()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'apk={apk.as_posix()}\n')
          PY
      - name: Save ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veycad-arm64-debug-${{ github.sha }}
          path: ${{ steps.debug-apk.outputs.apk }}
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/reports/python-tests.json
