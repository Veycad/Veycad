name: Android UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      custom_music_targeted:
        description: Decode the pinned custom-music MP4 and run frozen visual renderer controls
        type: boolean
        default: false
      custom_music_audio_probe:
        description: Trace native PCM formats from the pinned fresh CI20 MP4 without rendering video
        type: boolean
        default: false
      custom_music_software_audio:
        description: Optional software AAC diagnostic materials or pinned API26/API36 experiment
        type: choice
        options: ['off', 'prepare', 'probe']
        default: 'off'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.custom_music_software_audio == 'prepare' && 'software-prepare' || inputs.custom_music_software_audio == 'probe' && 'software-probe' || inputs.custom_music_audio_probe && 'audio-probe' || inputs.custom_music_targeted && 'targeted' || 'ui' }}
  cancel-in-progress: true

jobs:
  diagnostic-input-guard:
    if: github.event_name == 'workflow_dispatch' && ((inputs.custom_music_targeted && inputs.custom_music_audio_probe) || ((inputs.custom_music_targeted || inputs.custom_music_audio_probe) && (inputs.custom_music_software_audio == 'prepare' || inputs.custom_music_software_audio == 'probe')))
    runs-on: ubuntu-latest
    steps:
      - name: Require one diagnostic mode
        run: |
          echo 'Select only one custom-music diagnostic mode.' >&2
          exit 1
  ui:
    if: github.event_name != 'workflow_dispatch' || (!inputs.custom_music_targeted && !inputs.custom_music_audio_probe && inputs.custom_music_software_audio != 'prepare' && inputs.custom_music_software_audio != 'probe')
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Run real UI and permission tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: AutoEditUi_API36
          emulator-port: 5556
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: pwsh -NoProfile -File tools/run_ui_tests.ps1
      - name: Verify retained AAC with independent unclamped float decoder
        if: always()
        run: |
          bash tools/install_source_aac_oracle.sh
          export PATH="$PWD/build/tools/source-aac-oracle/bin:$PATH"
          python3 tools/verify_source_aac.py build/reports/ui-tests/runs
      - name: Record isolated test APK provenance
        env:
          VEYCAD_BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk_dir = Path('app/build/outputs/apk/uiTest')
          metadata = json.loads((apk_dir / 'output-metadata.json').read_text())
          if metadata['applicationId'] != 'com.veycad.app.uitest':
              raise ValueError('Refusing to distribute a test APK with the production identity')
          element = next(item for item in metadata['elements']
                         if any(f['filterType'] == 'ABI' and f['value'] == 'arm64-v8a'
                                for f in item['filters']))
          apk = apk_dir / element['outputFile']
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          record = {
              'head': os.environ['VEYCAD_BUILD_HEAD'],
              'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'apk': apk.name,
              'bytes': apk.stat().st_size,
              'sha256': digest,
              'applicationId': metadata['applicationId'],
              'versionName': element['versionName'],
              'versionCode': element['versionCode'],
              'abi': 'arm64-v8a',
              'variant': 'uiTest',
              'minSdk': metadata['minSdkVersionForDexing'],
          }
          Path('build/reports/test-apk-source.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Save isolated ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: veycad-text-test-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/uiTest/app-arm64-v8a-uiTest.apk
            build/reports/test-apk-source.json
      - name: Save UI reports and device failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/ui-tests/
            build/reports/source-aac-oracle/

  custom-music-targeted:
    if: github.event_name == 'workflow_dispatch' && inputs.custom_music_targeted && !inputs.custom_music_audio_probe && inputs.custom_music_software_audio != 'prepare' && inputs.custom_music_software_audio != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Download and verify pinned synthetic evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reports/custom-music-targeted
          gh api repos/Veycad/Veycad/actions/artifacts/11670925739/zip > build/reports/custom-music-targeted/source-artifact.zip
          gh api repos/Veycad/Veycad/actions/runs/38054343649 > build/reports/custom-music-targeted/source-run.json
          gh api repos/Veycad/Veycad/commits/1a2c18c09bd29568dc2a7a3c1a38fc1efa3cc0c3 > build/reports/custom-music-targeted/source-commit.json
          python3 tools/custom_music_tests/prepare_targeted_input.py build/reports/custom-music-targeted/source-artifact.zip build/reports/custom-music-targeted/input --run-metadata build/reports/custom-music-targeted/source-run.json --commit-metadata build/reports/custom-music-targeted/source-commit.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Decode retained frames and compare frozen visual renderers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: CustomMusicDiagnostic_API36
          emulator-port: 5556
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/run_custom_music_targeted.sh
      - name: Save diagnostic input, reports and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-music-targeted-reports
          path: build/reports/custom-music-targeted/

  custom-music-audio-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.custom_music_audio_probe && !inputs.custom_music_targeted && inputs.custom_music_software_audio != 'prepare' && inputs.custom_music_software_audio != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Download and verify fresh CI20 native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reports/custom-music-audio-probe
          gh api repos/Veycad/Veycad/actions/artifacts/11672718841/zip > build/reports/custom-music-audio-probe/source-artifact.zip
          gh api repos/Veycad/Veycad/actions/artifacts/11672718841 > build/reports/custom-music-audio-probe/source-artifact.json
          gh api repos/Veycad/Veycad/actions/runs/38059647484 > build/reports/custom-music-audio-probe/source-run.json
          gh api repos/Veycad/Veycad/commits/33b68e3f0643ce95acb46bdf8f3e075448388492 > build/reports/custom-music-audio-probe/source-commit.json
          python3 tools/custom_music_tests/prepare_audio_probe_input.py build/reports/custom-music-audio-probe/source-artifact.zip build/reports/custom-music-audio-probe/input --run-metadata build/reports/custom-music-audio-probe/source-run.json --commit-metadata build/reports/custom-music-audio-probe/source-commit.json --artifact-metadata build/reports/custom-music-audio-probe/source-artifact.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Decode saved audio and retain native PCM format history
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: CustomMusicAudioProbe_API36
          emulator-port: 5556
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/run_custom_music_audio_probe.sh
      - name: Save audio probe input, report and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-music-audio-probe-reports
          path: build/reports/custom-music-audio-probe/

  custom-music-software-materials:
    if: github.event_name == 'workflow_dispatch' && inputs.custom_music_software_audio == 'prepare' && !inputs.custom_music_targeted && !inputs.custom_music_audio_probe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Verify material helper contracts
        run: python3 -m unittest discover -s tools/custom_music_tests -p 'test_software_aac*.py' -v
      - name: Download and verify original native CI20 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=build/reports/custom-music-software-materials
          mkdir -p "$root"
          gh api repos/Veycad/Veycad/actions/artifacts/11672718841/zip > "$root/source-artifact.zip"
          gh api repos/Veycad/Veycad/actions/artifacts/11672718841 > "$root/source-artifact.json"
          gh api repos/Veycad/Veycad/actions/runs/38059647484 > "$root/source-run.json"
          gh api repos/Veycad/Veycad/commits/33b68e3f0643ce95acb46bdf8f3e075448388492 > "$root/source-commit.json"
          python3 tools/custom_music_tests/prepare_audio_probe_input.py "$root/source-artifact.zip" "$root/input" --run-metadata "$root/source-run.json" --commit-metadata "$root/source-commit.json" --artifact-metadata "$root/source-artifact.json"
      - name: Install pinned diagnostic NDK
        run: |
          sdkmanager_path="${ANDROID_SDK_ROOT:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$ANDROID_SDK_ROOT" 'ndk;27.2.12479018'
          test -f "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"
      - name: Build candidate and independently fix compressed AAC controls
        run: bash tools/run_custom_music_software_materials.sh
      - name: Save preparation evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-music-software-materials
          path: |
            build/reports/custom-music-software-materials/*
            !build/reports/custom-music-software-materials/build/source/android-build/**
            !build/reports/custom-music-software-materials/build/source/host-build/**
            !build/reports/custom-music-software-materials/build/source/ffmpeg/**

  custom-music-software-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.custom_music_software_audio == 'probe' && !inputs.custom_music_targeted && !inputs.custom_music_audio_probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
          - api: 36
            target: default
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Download and verify independently reviewed materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=build/reports/custom-music-software-probe
          mkdir -p "$root"
          mapfile -t pins < <(python3 tools/custom_music_tests/verify_software_aac_materials.py pins tools/custom_music_tests/software_aac_pins.json)
          test "${#pins[@]}" -eq 2
          gh api "repos/Veycad/Veycad/actions/artifacts/${pins[0]}/zip" > "$root/materials-artifact.zip"
          gh api "repos/Veycad/Veycad/actions/artifacts/${pins[0]}" > "$root/materials-artifact.json"
          gh api "repos/Veycad/Veycad/actions/runs/${pins[1]}" > "$root/materials-run.json"
          python3 tools/custom_music_tests/verify_software_aac_materials.py stage "$root/materials-artifact.zip" "$root/staged" --pins tools/custom_music_tests/software_aac_pins.json --artifact "$root/materials-artifact.json" --run "$root/materials-run.json"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Decode the same pinned compressed inputs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: SoftwareAac_API${{ matrix.api }}
          emulator-port: 5556
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/run_custom_music_software_audio.sh ${{ matrix.api }}
      - name: Save actual PCM, packet/frame ledgers, APKs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-music-software-probe-api${{ matrix.api }}
          path: build/reports/custom-music-software-probe/
