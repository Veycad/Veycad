name: Android UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Run real UI and permission tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: AutoEditUi_API36
          emulator-port: 5556
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: pwsh -NoProfile -File tools/run_ui_tests.ps1
      - name: Record isolated test APK provenance
        env:
          VEYCAD_BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          apk_dir = Path('app/build/outputs/apk/uiTest')
          metadata = json.loads((apk_dir / 'output-metadata.json').read_text())
          if metadata['applicationId'] != 'com.veycad.app.uitest':
              raise ValueError('Refusing to distribute a test APK with the production identity')
          element = next(item for item in metadata['elements']
                         if any(f['filterType'] == 'ABI' and f['value'] == 'arm64-v8a'
                                for f in item['filters']))
          apk = apk_dir / element['outputFile']
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          record = {
              'head': os.environ['VEYCAD_BUILD_HEAD'],
              'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'apk': apk.name,
              'bytes': apk.stat().st_size,
              'sha256': digest,
              'applicationId': metadata['applicationId'],
              'versionName': element['versionName'],
              'versionCode': element['versionCode'],
              'abi': 'arm64-v8a',
              'variant': 'uiTest',
              'minSdk': metadata['minSdkVersionForDexing'],
          }
          Path('build/reports/test-apk-source.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Save isolated ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: veycad-text-test-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/uiTest/app-arm64-v8a-uiTest.apk
            build/reports/test-apk-source.json
      - name: Save UI reports and device failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/ui-tests/
